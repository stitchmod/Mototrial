<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1c2425">
<link rel="icon" href="data:,">
<title>GRAVEL — Мототриал</title>
<style>
:root{--ink:#171b1c;--paper:#eee9dc;--accent:#f2b544;--orange:#eb6238;--glass:rgba(19,24,25,.88)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c2425;color:var(--paper);font-family:Inter,"Segoe UI",Arial,sans-serif;touch-action:none}button{font:inherit}canvas{display:block;width:100%;height:100%}#app{position:fixed;inset:0}#vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,15,16,.12),transparent 25%,transparent 72%,rgba(10,13,14,.35)),radial-gradient(ellipse at center,transparent 45%,rgba(10,14,15,.28));z-index:2}
.hidden{display:none!important}.ui{position:fixed;z-index:5}.key{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:24px;padding:0 6px;border:1px solid rgba(255,255,255,.28);border-bottom-width:2px;border-radius:4px;background:rgba(255,255,255,.08);font:700 11px/1 ui-monospace,monospace;color:#fff}
#hud{inset:0;pointer-events:none;padding:22px 26px}.hud-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:18px}.brand{font:900 21px/1 "Arial Narrow",Impact,sans-serif;letter-spacing:.06em}.brand span{color:var(--accent)}.level-line{margin-top:7px;font:600 11px/1.2 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72)}.timer{text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.25)}.timer-label{font:700 9px/1 ui-monospace,monospace;letter-spacing:.26em;color:rgba(255,255,255,.68)}#time{font:700 30px/1.1 ui-monospace,monospace;letter-spacing:-.06em;margin-top:5px}.hud-right{display:flex;justify-content:flex-end;align-items:center;gap:9px}.faults{padding-right:12px;text-align:right}.faults b{display:block;font:700 22px/1 ui-monospace,monospace}.faults small{font:700 9px/1 ui-monospace,monospace;letter-spacing:.16em;color:rgba(255,255,255,.65)}.icon-btn{pointer-events:auto;width:40px;height:40px;border:1px solid rgba(255,255,255,.25);border-radius:6px;color:#fff;background:rgba(18,23,24,.42);backdrop-filter:blur(8px);cursor:pointer;font-size:17px;transition:.18s}.icon-btn:hover{background:rgba(18,23,24,.78);border-color:rgba(255,255,255,.5)}
#progress-wrap{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);width:min(460px,52vw);text-align:center}.progress-labels{display:flex;justify-content:space-between;margin-bottom:8px;font:700 9px/1 ui-monospace,monospace;letter-spacing:.15em;color:rgba(255,255,255,.75)}.progress-track{height:4px;background:rgba(14,19,20,.35);position:relative;border-radius:4px;box-shadow:0 1px 0 rgba(255,255,255,.16)}#progress-fill{height:100%;width:0;background:var(--paper);border-radius:4px;transition:width .12s linear}.checkpoint-dot{position:absolute;top:50%;left:50%;width:10px;height:10px;border:2px solid var(--paper);background:#4a5552;border-radius:50%;transform:translate(-50%,-50%)}.checkpoint-dot.active{background:var(--accent)}
#toast{left:50%;top:25%;transform:translate(-50%,-12px);opacity:0;background:var(--paper);color:var(--ink);padding:11px 19px;font:800 11px/1 ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);transition:.25s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
#countdown{left:50%;top:42%;transform:translate(-50%,-50%);font:900 clamp(70px,12vw,150px)/1 Impact,"Arial Narrow",sans-serif;color:var(--paper);text-shadow:6px 7px 0 rgba(20,25,25,.25);pointer-events:none}
#overlay{inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,rgba(13,18,19,.72),rgba(13,18,19,.12) 68%,rgba(13,18,19,.25));pointer-events:auto}.panel{width:min(920px,calc(100vw - 42px));max-height:calc(100vh - 40px);overflow:auto;padding:36px 40px;background:linear-gradient(145deg,rgba(22,28,29,.95),rgba(22,28,29,.82));border:1px solid rgba(255,255,255,.14);box-shadow:0 28px 90px rgba(0,0,0,.35);backdrop-filter:blur(16px);clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}.panel.compact{width:min(480px,calc(100vw - 36px));text-align:center}.eyebrow{font:800 10px/1 ui-monospace,monospace;letter-spacing:.25em;color:var(--accent);text-transform:uppercase;margin-bottom:14px}.title{margin:0;font:900 clamp(54px,8vw,92px)/.82 Impact,"Arial Narrow",sans-serif;letter-spacing:.015em;text-transform:uppercase}.title span{display:block;color:var(--accent)}.lead{max-width:550px;margin:20px 0 25px;color:rgba(238,233,220,.72);font-size:14px;line-height:1.6}.menu-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:end}.section-label{font:800 9px/1 ui-monospace,monospace;letter-spacing:.2em;color:rgba(255,255,255,.52);text-transform:uppercase;margin:0 0 11px}.level-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.level-card{position:relative;text-align:left;min-height:102px;padding:13px 12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.045);color:var(--paper);cursor:pointer;transition:.18s}.level-card:hover:not(:disabled),.level-card.selected{border-color:var(--accent);background:rgba(242,181,68,.1);transform:translateY(-2px)}.level-card:disabled{cursor:not-allowed;opacity:.38}.level-card .num{font:700 10px/1 ui-monospace,monospace;color:var(--accent)}.level-card strong{display:block;margin-top:11px;font-size:14px}.level-card small{display:block;margin-top:5px;color:rgba(255,255,255,.52);font-size:10px}.level-card .best{position:absolute;bottom:9px;font:600 9px/1 ui-monospace,monospace;color:rgba(255,255,255,.65)}.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}.control-row{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,.68);font-size:11px}.control-row .keys{min-width:69px;display:flex;gap:4px}.actions{display:flex;align-items:center;gap:10px;margin-top:25px;flex-wrap:wrap}.primary,.secondary{border:0;cursor:pointer;text-transform:uppercase;font:800 11px/1 ui-monospace,monospace;letter-spacing:.13em;padding:16px 24px;transition:.18s;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}.primary{background:var(--accent);color:#1b2021}.primary:hover{background:#ffd067;transform:translateY(-2px)}.secondary{background:rgba(255,255,255,.08);color:var(--paper);border:1px solid rgba(255,255,255,.2)}.secondary:hover{background:rgba(255,255,255,.15)}.compact .actions{justify-content:center}.result-title{font:900 48px/.95 Impact,"Arial Narrow",sans-serif;text-transform:uppercase;margin:0 0 12px}.result-title.crash{color:var(--orange)}.result-sub{color:rgba(255,255,255,.62);font-size:13px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0 8px}.stat{background:rgba(255,255,255,.05);padding:15px 8px}.stat b{display:block;font:700 19px/1 ui-monospace,monospace}.stat small{display:block;margin-top:8px;font:700 8px/1 ui-monospace,monospace;letter-spacing:.14em;color:rgba(255,255,255,.5)}.medal{font-size:45px;margin:4px 0 12px}.record{color:var(--accent);font:800 10px/1 ui-monospace,monospace;letter-spacing:.16em;margin-top:14px}.fineprint{margin:20px 0 0;font-size:10px;color:rgba(255,255,255,.38)}
#touch{inset:0;pointer-events:none;z-index:6}.touch-cluster{position:absolute;bottom:24px;display:flex;gap:10px;pointer-events:auto}.touch-cluster.left{left:20px}.touch-cluster.right{right:20px}.touch-btn{width:64px;height:64px;border:1px solid rgba(255,255,255,.28);border-radius:50%;background:rgba(20,26,27,.38);color:#fff;backdrop-filter:blur(6px);font-size:23px;font-weight:700;user-select:none;-webkit-user-select:none}.touch-btn.active{background:rgba(242,181,68,.6);transform:scale(.96)}.touch-btn small{display:block;font:700 8px/1 ui-monospace,monospace;letter-spacing:.08em;margin-top:3px}
@media(pointer:fine){#touch{display:none}}@media(max-width:760px){.menu-grid>div:last-child{display:none}.desktop-only{display:none}#hud{padding:14px}.brand{font-size:17px}.level-line{font-size:9px}#time{font-size:23px}.faults{display:none}.hud-top{gap:8px}.icon-btn{width:36px;height:36px}.panel{padding:25px 24px}.menu-grid{grid-template-columns:1fr;gap:20px}.title{font-size:54px}.lead{margin:14px 0 18px}.level-card{min-height:88px}.controls-grid{display:none}#progress-wrap{bottom:102px;width:52vw}.actions{margin-top:18px}.primary,.secondary{padding:14px 17px}.touch-btn{width:58px;height:58px}.touch-cluster{bottom:20px}.touch-cluster.left{left:14px}.touch-cluster.right{right:14px}}@media(max-height:620px){.panel{padding:22px 28px}.title{font-size:48px}.lead{margin:10px 0 14px}.level-card{min-height:79px}.level-card small{display:none}.actions{margin-top:14px}.fineprint{display:none}.controls-grid{gap:6px 12px}.eyebrow{margin-bottom:9px}}
</style>
</head>
<body>
<div id="app"></div><div id="vignette"></div>
<div id="hud" class="ui hidden">
  <div class="hud-top">
    <div><div class="brand">GRAVEL <span>//</span> TRIAL</div><div class="level-line" id="hud-level"></div></div>
    <div class="timer"><div class="timer-label">ВРЕМЯ</div><div id="time">00:00.00</div></div>
    <div class="hud-right"><div class="faults"><b id="faults">0</b><small>ОШИБКИ</small></div><button id="mute" class="icon-btn" aria-label="Звук">♪</button><button id="pause" class="icon-btn" aria-label="Пауза">Ⅱ</button></div>
  </div>
  <div id="progress-wrap"><div class="progress-labels"><span>СТАРТ</span><span>ФИНИШ</span></div><div class="progress-track"><div id="progress-fill"></div><div id="checkpoint-dot" class="checkpoint-dot"></div></div></div>
</div>
<div id="toast" class="ui">КОНТРОЛЬНАЯ ТОЧКА</div><div id="countdown" class="ui hidden">3</div>
<div id="overlay" class="ui"></div>
<div id="touch" class="ui hidden">
  <div class="touch-cluster left"><button class="touch-btn" data-control="left" aria-label="Назад">↶<small>НАЗАД</small></button><button class="touch-btn" data-control="right" aria-label="Вперёд">↷<small>ВПЕРЁД</small></button></div>
  <div class="touch-cluster right"><button class="touch-btn" data-control="brake" aria-label="Тормоз">■<small>ТОРМОЗ</small></button><button class="touch-btn" data-control="gas" aria-label="Газ">▲<small>ГАЗ</small></button></div>
</div>
<script type="module" src="./src/scene.js"></script>
</body>
</html>
